server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 访问根路径时跳到博客目录
    location = / {
        return 302 /blog/;
    }

    # 站点部署在 /blog 子路径下
    location /blog/ {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存（文件名带版本号，可放心缓存）
    location ~* ^/blog/.*\.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML 不缓存，保证发文后即时可见
    location ~* ^/blog/.*\.html?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    access_log off;
    error_log  /var/log/nginx/error.log warn;
}
